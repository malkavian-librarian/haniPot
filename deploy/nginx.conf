pid /tmp/nginx.pid;
error_log /dev/null crit;
worker_processes 1;
events { worker_connections 256; }
http {
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format counts escape=json '{"interaction":"$request_id","status":$status,"requestBytes":$request_length,"responseBytes":$bytes_sent}';
  access_log /dev/stdout counts;
  limit_conn_zone $server_name zone=all_connections:64k;
  limit_req_zone $server_name zone=all_requests:64k rate=100r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    server_name _;
    limit_conn all_connections 128;
    limit_req zone=all_requests burst=200 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    keepalive_requests 100;
    large_client_header_buffers 2 8k;
    location / {
      proxy_pass http://gateway:18789;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded '';
      proxy_set_header X-Real-IP '';
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 125s;
      proxy_send_timeout 5s;
    }
  }
}
